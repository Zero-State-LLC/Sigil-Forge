[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-forge"
dynamic = ["version"]
description = "Forge offline intent glyphs into encrypted wallpapers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zero State LLC" }]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
schema = ["jsonschema>=4"]
argon2 = ["argon2-cffi>=23"]

[project.scripts]
sigil-forge = "sigil_forge.cli:main"

[project.urls]
Repository = "https://github.com/Zero-State-LLC/Sigil-Forge"

[tool.setuptools.packages.find]
# The engine is the sigil_forge package under src/. Data directories
# (schemas/, references/, zk/) are not packaged yet: an installed wheel needs
# SIGIL_FORGE_HOME or HERMES_SKILL_DIR pointing at a full skill tree, while a
# checkout or Hermes install finds them by the SKILL.md + VERSION marker walk
# in sigil_forge.paths.skill_root(). See docs/PACKAGING-RESEARCH-2026-11.md.
where = ["src"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }
