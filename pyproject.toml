[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-forge"
dynamic = ["version"]
description = "Forge offline intent glyphs into encrypted wallpapers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zero State LLC" }]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
schema = ["jsonschema>=4"]
argon2 = ["argon2-cffi>=23"]

[project.urls]
Repository = "https://github.com/Zero-State-LLC/Sigil-Forge"

[tool.setuptools]
# Metadata only for now: the engine still lives in scripts/ and is not yet an
# importable package. See docs/PACKAGING-RESEARCH-2026-11.md.
py-modules = []

[tool.setuptools.dynamic]
version = { file = "VERSION" }
