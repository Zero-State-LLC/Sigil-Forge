# Correctness rules: syntax errors, pyflakes (undefined names, unused imports
# and variables), the bugbear set, bare `except`, and files opened without a
# context manager. No style or formatting rules.
target-version = "py310"
# Local folders that are not part of the project: agent worktrees and scratch.
extend-exclude = [".claude", "evidence", "research", "proposed-grants"]

[lint]
select = ["E9", "F", "B", "E722", "SIM115"]
# B905 wants zip(strict=True). Adding it would turn a length mismatch into an
# exception in code paths that have never needed one; not worth the risk.
ignore = ["B905"]
