name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The README promises a stdlib-only core path, so one leg installs
          # nothing but the test runner on the oldest supported Python.
          - python: "3.10"
            deps: stdlib
          - python: "3.13"
            deps: optional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Install optional dependencies
        if: matrix.deps == 'optional'
        run: python -m pip install -r requirements-optional.txt
      - name: Install Noir proof toolchain (pinned, checksum-verified)
        # Without it the real prove/verify tests skip and the Noir path is
        # green but untested. One leg is enough; the other keeps proving that
        # the engine works with no toolchain at all.
        if: matrix.deps == 'optional'
        run: bash scripts/install-noir-toolchain.sh
      - name: Lint (syntax errors and pyflakes)
        run: python -m ruff check .
      - name: Version is the same everywhere
        run: python3 scripts/set_version.py --check
      - name: Hermes frontmatter
        run: python3 scripts/validate_hermes_skill.py
      - name: Tests
        run: python3 -m pytest -q
      - name: Install preview
        run: bash install.sh --dry-run
      - name: Package install check
        # Install the wheel into a clean venv and run it from outside the
        # checkout, so an import that only works from the source tree fails here.
        run: |
          python -m venv "$RUNNER_TEMP/pkg-venv"
          "$RUNNER_TEMP/pkg-venv/bin/python" -m pip install --quiet .
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pkg-venv/bin/python" -c "import sigil_forge.cli, sigil_forge.construct"
          "$RUNNER_TEMP/pkg-venv/bin/sigil-forge" --help > /dev/null
          SIGIL_FORGE_HOME="$GITHUB_WORKSPACE" "$RUNNER_TEMP/pkg-venv/bin/sigil-forge" check
